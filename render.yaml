services:
  - type: web
    name: knotify-backend
    runtime: java
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/*.jar
    envVars:
      - key: PORT
        value: 8002
      - key: DATABASE_URL
        fromDatabase:
          name: knotify-db
          property: connectionURI
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://your-frontend.vercel.app
      - key: SPRING_PROFILES_ACTIVE
        value: prod

databases:
  - name: knotify-db
    plan: free
    databaseName: knotify
