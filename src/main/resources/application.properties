spring.application.name=crochetstore
server.port=${PORT:8002}

# Database - Use DATABASE_URL env variable in production
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/crochet_store}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

logging.level.root=INFO
logging.level.com.crochet=DEBUG

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Flyway safely baselines deployments that already have Hibernate-created tables.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# CORS
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:3002,http://localhost:3005,http://localhost:5173}

